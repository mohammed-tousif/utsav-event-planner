# Render Blueprint for Utsav (free web service).
# GEMINI_API_KEY is set in the Render dashboard, never in this file.
services:
  - type: web
    name: utsav-event-planner
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.6-flash,gemini-3.8-flash
      - key: GEMINI_THINKING_LEVEL
        value: LOW
